# Configuration for the 5-minute "Up or Down" bot (python -m updown.main).
# Secrets (private key, wallet) stay in .env, shared with the main bot.

# Which 5-minute markets to trade: btc, eth, sol, xrp, bnb, doge, hype.
# Prices: Binance spot, except hype (Hyperliquid). Remove any you don't want.
assets: [btc, eth, sol, xrp, bnb, doge, hype]

# Gamma slug of the market for a window opening at unix time {start}.
# Check one on polymarket.com (the URL ends with the slug) and fix this if
# Polymarket changes its naming.
slug_template: "{asset}-updown-5m-{start}"
window_seconds: 300
tick_seconds: 1.0
# Live snapshot read by the radar dashboard (python scripts/updown_dashboard.py).
state_path: "data/updown_state.json"

model:
  vol_halflife_s: 180      # how fast the live volatility estimate adapts
  vol_floor: 0.00004       # clamp on volatility per sqrt(second)
  vol_cap: 0.0006
  vol_multiplier: 1.0      # >1 widens the distribution for fat tails
  vol_uncertainty: 0.3     # entries must keep their edge if vol is +-30% off
  basis_sd: 0.00015        # feed-vs-oracle uncertainty (log return, 0.015%)

fees:
  # Taker fee per share = fee_rate * (p * (1 - p)) ** fee_exponent.
  # VERIFY against Polymarket's current fee docs before trading live.
  fee_rate: 0.25
  fee_exponent: 2.0

strategy:
  max_seconds_left: 240    # skip the first minute of each window
  min_seconds_left: 8      # and the last few seconds
  min_edge: 0.04           # min expected profit per $1 share, after fees
  min_price: 0.08          # never buy below 8c...
  max_price: 0.92          # ...or above 92c
  max_model_market_gap: 0.30
  market_weight: 0.5       # blend model with market price (0 = model only)
  exit_margin: 0.06        # sell early if the bid beats fair value by 6c
  max_entries_per_window: 2
  min_seconds_between_entries: 20   # wait before adding to a position

sizing:
  bankroll_usd: 1000       # capital set aside for this bot
  kelly_fraction: 0.15     # fraction of full Kelly per bet
  max_bet_usd: 5
  max_window_exposure_usd: 10
  max_same_direction_usd: 20   # all coins together, per side (coins move together)
  min_order_usd: 1

risk:
  max_daily_loss_usd: 250
  max_consecutive_losses: 4
  cooldown_minutes: 30

feed:
  binance_host: "https://api.binance.com"   # US: https://api.binance.us
  poll_seconds: 1.0
  max_age_s: 3.0

# ---------------------------------------------------------------------------
# Strategy mode.
#   maker: rest post-only bids on BOTH Up and Down; a filled pair (1 Up +
#          1 Down) always pays $1, so pairs bought under $1 are locked profit.
#          Makers pay no fee. (default)
#   taker: the original fair-value strategy (buys mispriced asks, pays fees).
mode: maker

maker:
  quote_start_s: 15        # start quoting this long after the window opens
  stop_quoting_s: 60       # pull all bids with this many seconds left
  half_spread: 0.03        # minimum distance below fair price, each side
  vol_spread_mult: 2.5     # ...widened with how fast the probability moves
  reaction_s: 2.0          # our reaction time used for that widening
  tick: 0.01
  quote_shares: 10         # shares per bid
  max_side_shares: 40      # per window, per side
  max_imbalance_shares: 10 # max unpaired shares (Up - Down or Down - Up)
  skew_per_share: 0.002    # lean bids toward completing pairs
  pair_margin: 0.02        # a pair must cost at most 1 - this
  min_price: 0.15         # only quote while the market is still undecided
  max_price: 0.85
  requote_s: 3             # raise a bid at most this often (lowering is instant)
  requote_ticks: 1
  fast_move_z: 3.0         # pull bids after a move this many sigmas...
  fast_move_window_s: 5    # ...within this many seconds...
  fast_move_cooldown_s: 15 # ...for this long
  max_model_gap: 0.25      # stay out if our model and the market disagree this much
