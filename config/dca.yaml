# DCA futures bot — Binance USDⓈ-M perpetual. API keys live in .env, not here.
# Check the full ladder with:  python scripts/dca_plan.py

symbol: SOL/USDT:USDT
timeframe: 15m             # candle timeframe for the entry filter
poll_interval_seconds: 10
capital_usdt: 1000
leverage: 3                # isolated margin; startup refuses unsafe combos
maintenance_margin_rate: 0.01   # conservative; Binance's SOL tier is lower
maker_fee: 0.0002
taker_fee: 0.0005

# Hedge mode lets a long and a short deal run at the same time.
sides: [long, short]

ladder:
  base_order_usdt: 40      # notional (position value), not margin
  safety_order_usdt: 40
  max_safety_orders: 6
  price_deviation_pct: 1.5 # first safety order 1.5% against the entry
  step_scale: 1.3          # each gap 1.3x wider than the previous one
  volume_scale: 1.5        # each safety order 1.5x bigger than the previous one
  take_profit_pct: 1.0     # from the average entry price
  stop_loss_pct: 24        # from the base entry; last safety order sits at ~19.1%

entry:
  mode: rsi                # rsi | always
  rsi_period: 14
  long_rsi_below: 30
  short_rsi_above: 70
  trend_filter: false      # true: long only above EMA, short only below
  ema_period: 200

risk:
  liquidation_buffer_pct: 5
  max_daily_loss_usdt: 100        # no new deals for the rest of the UTC day
  cooldown_minutes_after_stop: 60
  max_capital_usage: 0.9
  exchange_stop_loss: true
